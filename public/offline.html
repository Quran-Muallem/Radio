<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1120" />
  <title>Offline – Quran Radio</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0B1120; color: #e2e8f0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 2rem 1.5rem; box-sizing: border-box; }
    .icon { width: 84px; height: 84px; border-radius: 24px; background: #111a2e; display: grid; place-items: center;
      box-shadow: 0 0 0 1px rgba(245,158,11,.25), 0 0 60px rgba(245,158,11,.12); margin-bottom: 1.5rem; }
    h1 { font-size: 1.3rem; margin: 0 0 .5rem; color: #fff; font-weight: 600; }
    p { margin: 0 auto; max-width: 26rem; line-height: 1.55; color: #94a3b8; font-size: .95rem; }
    button { margin-top: 1.75rem; border: 0; border-radius: 999px; padding: .85rem 1.6rem; font-size: 1rem; font-weight: 600;
      background: #10B981; color: #0B1120; cursor: pointer; }
    button:active { transform: scale(.96); }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 8.8a15 15 0 0 1 4.2-2.6M9.6 5.2A15 15 0 0 1 22 8.8M5 12.5a10 10 0 0 1 3.4-2.1M16.6 10.6a10 10 0 0 1 2.4 1.9M8.5 16.1a5 5 0 0 1 7 0"/>
        <circle cx="12" cy="19.5" r="1" fill="#F59E0B"/><path d="m3 3 18 18"/>
      </svg>
    </div>
    <h1>Keine Internetverbindung</h1>
    <p>Quran Radio braucht Internet, um die Live-Streams direkt von den Sendern abzuspielen. Prüfe WLAN oder mobile Daten.</p>
    <button type="button" onclick="location.reload()">Erneut versuchen</button>
  </main>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
